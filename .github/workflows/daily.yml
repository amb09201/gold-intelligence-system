name: Gold Intelligence Daily Run

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    - cron: '30 3 * * *'
    # 14:30 IST = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  run-gold-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > service_account.json

      - name: Run main script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_NAME: Gold_Rates
          DASHBOARD_NAME: Dashboard
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          BUY_TARGET: ${{ secrets.BUY_TARGET }}
          ENABLE_TELEGRAM: "True"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Clean up credentials file
        if: always()
        run: rm -f service_account.json
