name: Daily Gold Intelligence Run

on:
  schedule:
    # Runs every day at 06:00 UTC — adjust as needed
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  run-gold-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          GOLD_API_URL: ${{ secrets.GOLD_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          python main.py
